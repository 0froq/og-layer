name: Make repository public

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/make-public.yml

permissions:
  administration: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set visibility to public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f visibility=public
